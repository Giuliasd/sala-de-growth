name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

# Token só de leitura: o CI roda código de PR e não precisa escrever nada.
permissions:
  contents: read

jobs:
  check:
    name: Type-check, lint & tests
    runs-on: ubuntu-latest

    env:
      # Prisma exige a env var existir, mas nada conecta no DB durante o CI.
      # Esse valor é fictício de propósito.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_dummy

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint

      - name: Tests
        run: npm test
