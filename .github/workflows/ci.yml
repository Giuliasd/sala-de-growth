name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Token só de leitura: o CI roda código de PR e não precisa escrever nada.
permissions:
  contents: read

jobs:
  check:
    name: Type-check, lint & tests
    runs-on: ubuntu-latest

    env:
      # Prisma exige a env var existir, mas nada conecta no DB durante o CI.
      # Esse valor é fictício de propósito.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_dummy

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint

      - name: Tests
        run: npm test
