name: Weekly npm audit

on:
  # Toda segunda-feira às 09:00 UTC (06:00 em SP).
  schedule:
    - cron: '0 9 * * 1'
  # Permite rodar manualmente pelo botão "Run workflow" no GitHub.
  workflow_dispatch:

# Mínimo necessário: ler o código e abrir/comentar a issue do relatório.
permissions:
  contents: read
  issues: write

jobs:
  audit:
    name: npm audit (high+critical)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Run audit
        # Falha o job se houver vulnerabilidade HIGH ou CRITICAL.
        # Vulns moderate/low não bloqueiam — visíveis no resumo abaixo.
        run: |
          set +e
          npm audit --audit-level=high
          AUDIT_EXIT=$?
          echo ""
          echo "--- Resumo (todas severidades) ---"
          npm audit || true
          exit $AUDIT_EXIT

      - name: Abrir/atualizar issue se falhou
        if: failure()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const title = "⚠️ npm audit: vulnerabilidades high/critical detectadas"
            const body = [
              `O job semanal de \`npm audit\` falhou em ${context.sha.slice(0, 7)}.`,
              ``,
              `Veja o run para detalhes: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              ``,
              `**Como resolver:**`,
              ``,
              `1. \`npm audit\` localmente pra ver os pacotes afetados`,
              `2. \`npm audit fix\` (ou bumpar a dep manualmente se for major)`,
              `3. Abrir PR com o lockfile atualizado`,
            ].join("\n")
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "security",
            })
            const existing = issues.data.find(i => i.title === title)
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Falhou novamente em ${context.sha.slice(0, 7)} — ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              })
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ["security"],
              })
            }
