name: Relatar um bug
description: Algo não funciona como deveria.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Obrigada por relatar! Antes de enviar, veja se já não existe uma issue parecida.
        **Falha de segurança?** Não abra uma issue pública — siga o [SECURITY.md](https://github.com/Giuliasd/sala-de-growth/blob/main/SECURITY.md).
  - type: textarea
    id: o-que-aconteceu
    attributes:
      label: O que aconteceu?
      description: Descreva o problema com as suas palavras.
    validations:
      required: true
  - type: textarea
    id: como-reproduzir
    attributes:
      label: Como reproduzir
      description: Passo a passo para fazer o problema acontecer.
      placeholder: |
        1. Vá até a tela de...
        2. Clique em...
        3. Veja o erro...
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: O que você esperava que acontecesse?
    validations:
      required: true
  - type: textarea
    id: prints-e-logs
    attributes:
      label: Prints ou mensagens de erro
      description: Se tiver, cole aqui. Não inclua senhas, tokens nem dados pessoais.
  - type: input
    id: versao
    attributes:
      label: Versão
      description: "Aparece no rodapé da barra lateral (ex.: v1.0.0 · a1b2c3d)."
  - type: input
    id: ambiente
    attributes:
      label: Navegador e sistema
      placeholder: "Ex.: Chrome 131 no Windows 11"
